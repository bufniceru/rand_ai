[project]
name = "rand-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
    "ty>=0.0.61",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=rand_ai.draw --cov=rand_ai.draws --cov-report=term-missing --cov-fail-under=100"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)s %(message)s"
